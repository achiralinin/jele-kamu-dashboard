name: Auto Update Dashboard

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8          # กันค้างยาว — เดิมรัน 15 นาทีแล้วล้ม
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt-dlp
        run: pip install -U yt-dlp

      # ดึง TikTok — ถ้าล้มก็ไม่ทำให้ทั้ง run พัง (สคริปต์เก็บค่ารอบก่อนให้อยู่แล้ว)
      - name: Scrape TikTok
        continue-on-error: true
        run: python3 scripts/tiktok_scraper.py scrape_results.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scrape_results.json
          if git diff --staged --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "Auto-update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main || true
          git push
